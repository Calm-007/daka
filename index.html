<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日打卡</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4f46e5">
<style>
/* ========================================
   CSS Variables & Reset
   ======================================== */
  :root {
    --pri: #4f46e5;      --pri-light: #eef2ff;
    --green: #10b981;    --green-light: #ecfdf5;
    --amber: #f59e0b;    --amber-light: #fffbeb;
    --red: #ef4444;      --red-light: #fef2f2;
    --bg: #f8fafc;       --card: #ffffff;
    --text: #1e293b;     --sub: #64748b;      --line: #e2e8f0;
    --radius: 12px;      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

/* ========================================
   Layout
   ======================================== */
  .app { display:flex; flex-direction:column; height:100vh; }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 28px;
    background: var(--card); border-bottom:1px solid var(--line);
    -webkit-app-region: drag; user-select:none;
    gap:16px;
  }
  .header-left { display:flex; align-items:center; gap:12px; -webkit-app-region: no-drag; }
  .header-right { display:flex; align-items:center; gap:8px; -webkit-app-region: no-drag; }
  header h1 { font-size:18px; font-weight:700; letter-spacing:-0.3px; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  header h1 svg { width:22px; height:22px; flex-shrink:0; }

  /* 视图切换 */
  .view-toggle {
    display:flex; background:var(--bg); border-radius:8px; padding:3px;
    border:1px solid var(--line);
  }
  .view-toggle button {
    border:none; background:none; padding:5px 14px; border-radius:6px;
    font-size:13px; font-weight:600; color:var(--sub); transition:.15s;
  }
  .view-toggle button.active { background:var(--card); color:var(--pri); box-shadow:0 1px 2px rgba(0,0,0,.06); }

  .plan-btn {
    border:1px solid var(--line); background:var(--card); padding:6px 14px;
    border-radius:8px; font-size:13px; font-weight:600; color:var(--text);
    display:flex; align-items:center; gap:4px; transition:.15s;
  }
  .plan-btn:hover { background:var(--pri-light); border-color:var(--pri); color:var(--pri); }

  .bell-btn {
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background: var(--card); font-size:15px; display:flex; align-items:center; justify-content:center;
    transition: .15s;
  }
  .bell-btn:hover { background:var(--pri-light); border-color:var(--pri); }
  .bell-btn.on { background:var(--green-light); border-color:var(--green); }

  main { display:flex; flex:1; overflow:hidden; }

/* ========================================
   Calendar Panel (shared)
   ======================================== */
  .cal-panel {
    width: 420px; min-width:420px;
    padding: 24px;
    display:flex; flex-direction:column; gap:16px;
    border-right:1px solid var(--line);
    background: var(--card);
    overflow-y: auto;
  }
  .nav-row {
    display:flex; align-items:center; justify-content:center; gap:20px;
    font-size:17px; font-weight:700;
  }
  .nav-row button {
    border:none; background:none; font-size:16px; color:var(--sub);
    padding:4px 8px; border-radius:6px; transition:.15s;
  }
  .nav-row button:hover { color:var(--pri); background:var(--pri-light); }

/* ---- Month View ---- */
  .weekdays {
    display:grid; grid-template-columns:repeat(7,1fr);
    text-align:center; font-size:12px; color:var(--sub); font-weight:600;
    padding:0 4px;
  }
  .days-grid {
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:3px; text-align:center;
  }
  .day-cell {
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    font-size:14px; font-weight:500;
    position:relative; cursor:pointer;
    transition: .12s;
    color: var(--text);
  }
  .day-cell:hover { background:var(--pri-light); }
  .day-cell.empty { pointer-events:none; visibility:hidden; }
  .day-cell.today   { box-shadow:inset 0 0 0 2px var(--pri); }
  .day-cell.selected { background:var(--pri); color:#fff; }
  .day-cell.selected.today { background:var(--pri); color:#fff; box-shadow:inset 0 0 0 2px #fff; }
  .day-cell .dot {
    position:absolute; bottom:5px; left:50%; transform:translateX(-50%);
    width:5px; height:5px; border-radius:50%;
  }
  .day-cell .dot.none   { background:#d1d5db; }
  .day-cell .dot.partial { background:var(--amber); }
  .day-cell .dot.done   { background:var(--green); }
  .day-cell.selected .dot.none,
  .day-cell.selected .dot.partial,
  .day-cell.selected .dot.done { background:rgba(255,255,255,.7); }
  .day-cell.future { color:#cbd5e1; }
  .day-cell.future .dot.none { background:#e5e7eb; }

/* ---- Week View ---- */
  .week-grid {
    display:flex; flex-direction:column; gap:4px; flex:1;
  }
  .week-day-row {
    display:flex; align-items:stretch; border-radius:10px; overflow:hidden;
    cursor:pointer; transition:.12s; min-height:48px;
    border:1px solid transparent;
  }
  .week-day-row:hover { background:var(--pri-light); }
  .week-day-row.selected { background:var(--pri); color:#fff; }
  .week-day-row.selected .week-day-label { color:rgba(255,255,255,.7); }
  .week-day-row.today { border-color:var(--pri); }
  .week-day-row.selected.today { border-color:#fff; }
  .week-day-label {
    width:52px; min-width:52px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:11px; color:var(--sub);
    font-weight:600; gap:1px;
  }
  .week-day-label .wd { font-size:15px; color:var(--text); font-weight:700; }
  .week-day-row.selected .week-day-label .wd { color:#fff; }
  .week-day-date { font-size:11px; }
  .week-day-tasks {
    flex:1; display:flex; flex-wrap:wrap; align-items:center; gap:3px 8px;
    padding:6px 10px; font-size:13px;
  }
  .week-day-tasks .wt {
    font-size:12px; padding:2px 8px; border-radius:10px;
    background:var(--bg); white-space:nowrap; max-width:160px; overflow:hidden; text-overflow:ellipsis;
  }
  .week-day-tasks .wt.done { text-decoration:line-through; opacity:.5; }
  .week-day-row.selected .week-day-tasks .wt { background:rgba(255,255,255,.15); color:#fff; }
  .week-empty { text-align:center; color:var(--sub); font-size:13px; padding:20px; }

  .legend { display:flex; gap:16px; font-size:12px; color:var(--sub); align-items:center; padding-top:4px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:3px; vertical-align:middle; }
  .legend i.l-done { background:var(--green); }
  .legend i.l-half { background:var(--amber); }
  .legend i.l-none { background:#d1d5db; }

/* ========================================
   Task Panel
   ======================================== */
  .task-panel {
    flex:1; display:flex; flex-direction:column;
    padding: 24px 32px; overflow-y: auto;
  }
  .task-panel .placeholder {
    flex:1; display:flex; align-items:center; justify-content:center;
    color: var(--sub); font-size:15px; user-select:none;
  }
  .task-header {
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    margin-bottom:20px;
  }
  .task-header .date-title { font-size:20px; font-weight:700; }
  .task-header .date-weekday { font-size:14px; color:var(--sub); margin-left:8px; }
  .progress-bar-wrap {
    height:6px; background:var(--line); border-radius:3px; margin-bottom:24px; overflow:hidden;
  }
  .progress-bar-fill {
    height:100%; border-radius:3px; background:var(--pri);
    transition: width .3s, background .3s;
  }
  .progress-bar-fill.full { background:var(--green); }
  .progress-text { font-size:13px; color:var(--sub); margin-bottom:6px; }
  .task-list { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .task-item {
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; background:var(--bg); border-radius:var(--radius);
    transition:.15s; border:1px solid transparent;
  }
  .task-item:hover { border-color:var(--line); background:var(--card); }
  .task-item.done { opacity:.6; }
  .task-check {
    width:22px; height:22px; border-radius:50%;
    border:2px solid #cbd5e1; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s;
  }
  .task-check:hover { border-color:var(--pri); }
  .task-item.done .task-check { background:var(--green); border-color:var(--green); }
  .task-check svg { width:12px; height:12px; opacity:0; transition:.15s; }
  .task-item.done .task-check svg { opacity:1; }
  .task-name {
    flex:1; font-size:15px; font-weight:500;
    cursor: pointer; padding:2px 4px; border-radius:4px; transition:.1s;
  }
  .task-name:hover { background:var(--pri-light); }
  .task-item.done .task-name { text-decoration:line-through; color:var(--sub); }
  .task-time {
    font-size:13px; color:var(--sub);
    display:flex; align-items:center; gap:4px;
    cursor:pointer; padding:2px 6px; border-radius:6px;
    transition:.1s; flex-shrink:0;
  }
  .task-time:hover { background:var(--pri-light); }
  .task-time.urgent { color:var(--red); font-weight:600; }
  .task-del {
    width:28px; height:28px; border-radius:6px; border:none;
    background:none; color:var(--sub); font-size:16px;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:.15s; flex-shrink:0;
  }
  .task-item:hover .task-del { opacity:1; }
  .task-del:hover { background:var(--red-light); color:var(--red); }
  .add-task-form {
    display:flex; gap:8px; padding:12px 16px;
    background:var(--card); border:2px dashed var(--line); border-radius:var(--radius);
    transition:.15s;
  }
  .add-task-form:focus-within { border-color:var(--pri); border-style:solid; }
  .add-task-form input[type="text"] { flex:1; border:none; background:none; font-size:15px; outline:none; }
  .add-task-form input[type="time"] {
    border:1px solid var(--line); border-radius:6px; padding:4px 8px;
    font-size:14px; color:var(--text); outline:none; width:110px;
  }
  .add-task-form input[type="time"]:focus { border-color:var(--pri); }
  .add-task-form button {
    padding:6px 16px; border:none; border-radius:8px;
    background:var(--pri); color:#fff; font-size:14px; font-weight:600;
    transition:.15s; flex-shrink:0;
  }
  .add-task-form button:hover { filter:brightness(1.1); }
  .copy-link {
    font-size:13px; color:var(--pri); cursor:pointer; user-select:none;
    margin-bottom:16px; display:inline-block;
  }
  .copy-link:hover { text-decoration:underline; }
  .day-status-badge {
    display:inline-block; padding:4px 12px; border-radius:20px;
    font-size:13px; font-weight:600;
  }
  .day-status-badge.all-done { background:var(--green-light); color:var(--green); }
  .day-status-badge.partial  { background:var(--amber-light); color:var(--amber); }
  .day-status-badge.empty    { background:var(--bg); color:var(--sub); }

/* ========================================
   Plan Modal
   ======================================== */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    z-index:100; animation: fadeIn .15s;
  }
  @keyframes fadeIn { from { opacity:0; } }
  .modal {
    background:var(--card); border-radius:16px;
    width:620px; max-width:90vw; max-height:85vh;
    display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
    animation: slideUp .2s;
  }
  @keyframes slideUp { from { transform:translateY(20px); opacity:0; } }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px; border-bottom:1px solid var(--line);
  }
  .modal-header h2 { font-size:18px; font-weight:700; }
  .modal-close {
    width:32px; height:32px; border-radius:8px; border:none;
    background:none; font-size:18px; color:var(--sub);
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover { background:var(--red-light); color:var(--red); }
  .modal-body { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:12px; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; }
  .modal-footer button {
    padding:8px 20px; border-radius:8px; font-size:14px; font-weight:600; border:none;
  }
  .btn-primary { background:var(--pri); color:#fff; }
  .btn-primary:hover { filter:brightness(1.1); }
  .btn-ghost { background:var(--bg); color:var(--text); border:1px solid var(--line); }
  .btn-ghost:hover { background:var(--line); }

  .plan-row {
    display:flex; align-items:flex-start; gap:12px;
    padding:12px; background:var(--bg); border-radius:var(--radius);
  }
  .plan-row-label {
    width:56px; min-width:56px; text-align:center; font-weight:700; font-size:14px;
    padding-top:8px;
  }
  .plan-row-tasks { flex:1; display:flex; flex-direction:column; gap:6px; }
  .plan-task-item {
    display:flex; align-items:center; gap:8px; font-size:14px;
  }
  .plan-task-item span { flex:1; }
  .plan-task-item input[type="time"] {
    border:1px solid var(--line); border-radius:6px; padding:3px 6px;
    font-size:13px; width:100px; outline:none;
  }
  .plan-task-item input[type="time"]:focus { border-color:var(--pri); }
  .plan-task-del {
    width:24px; height:24px; border-radius:4px; border:none;
    background:none; color:var(--sub); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .plan-task-del:hover { background:var(--red-light); color:var(--red); }
  .plan-add-task {
    display:flex; gap:6px; margin-top:4px;
  }
  .plan-add-task input[type="text"] {
    flex:1; border:1px dashed var(--line); border-radius:6px;
    padding:4px 8px; font-size:13px; outline:none; background:var(--card);
  }
  .plan-add-task input[type="text"]:focus { border-color:var(--pri); border-style:solid; }
  .plan-add-task input[type="time"] {
    border:1px dashed var(--line); border-radius:6px;
    padding:3px 6px; font-size:13px; width:90px; outline:none; background:var(--card);
  }
  .plan-add-task button {
    padding:4px 12px; border:none; border-radius:6px;
    background:var(--pri); color:#fff; font-size:12px; font-weight:600;
  }
  .plan-add-task button:hover { filter:brightness(1.1); }

/* ========================================
   Responsive
   ======================================== */
  @media (max-width:768px) {
    header { padding:10px 14px; gap:8px; }
    header h1 { font-size:15px; }
    main { flex-direction:column; }
    .cal-panel { width:100%; min-width:100%; border-right:none; border-bottom:1px solid var(--line); padding:14px; }
    .task-panel { padding:14px; }
    .modal { width:95vw; }
  }
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="app">
  <header>
    <div class="header-left">
      <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--pri)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          <polyline points="9 16 11 18 15 14"/>
        </svg>
        每日打卡
      </h1>
      <div class="view-toggle" id="viewToggle">
        <button class="active" data-view="month" onclick="switchView('month')">月视图</button>
        <button data-view="week" onclick="switchView('week')">周视图</button>
      </div>
    </div>
    <div class="header-right">
      <span id="syncStatus" style="font-size:16px;margin-right:4px" title="同步中…">🔄</span>
      <button class="plan-btn" onclick="openPlanModal()">📋 周计划</button>
      <button class="bell-btn" id="bellBtn" title="提醒状态" onclick="toggleNotification()">🔔</button>
    </div>
  </header>
  <main>
    <section class="cal-panel" id="calPanel"></section>
    <section class="task-panel" id="taskPanel">
      <div class="placeholder">👈 点击日期来管理任务</div>
    </section>
  </main>
</div>

<!-- ============================================================
     PLAN MODAL
     ============================================================ -->
<div class="modal-overlay" id="planModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2>📋 周计划模板</h2>
      <button class="modal-close" onclick="closePlanModal()">×</button>
    </div>
    <div class="modal-body" id="planModalBody"></div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closePlanModal()">关闭</button>
      <button class="btn-primary" onclick="applyPlanToWeek()">📅 应用到本周</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  DATA LAYER (Supabase cloud + localStorage fallback)
// ============================================================
const SUPABASE_URL = 'https://lvhyhlmebdfhytdlqyyf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2aHlobG1lYmRmaHl0ZGxxeXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MDEwMzMsImV4cCI6MjEwMDQ3NzAzM30.sreBKdbjujYjJuibu0ile0nOibbjnOTtu3g9Tmpf5hY';
const STORE = 'checkin_db';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let _db = null; // 内存缓存

async function initDB() {
  // 先读本地
  const local = (() => { try { return JSON.parse(localStorage.getItem(STORE)); } catch(_) { return null; } })();

  // 尝试从云端加载
  try {
    const { data } = await sb.from('checkin_data').select('data, updated_at').eq('id', 1).single();
    if (data?.data) {
      const cloud = data.data;
      // 合并策略：云端优先。如果本地有更新的数据（离线时编辑的），合并之
      const localTime = localStorage.getItem('checkin_last_sync');
      const cloudTime = data.updated_at;
      if (localTime && cloudTime && new Date(localTime) > new Date(cloudTime)) {
        // 本地更新 → 合并本地数据
        _db = { ...cloud, ...local };
        await saveToCloud(_db);
      } else {
        _db = cloud;
      }
      localStorage.setItem(STORE, JSON.stringify(_db));
      localStorage.setItem('checkin_last_sync', new Date().toISOString());
      updateSyncStatus('cloud');
      return;
    }
  } catch(e) {
    console.log('Cloud unavailable, using local data');
  }

  // 云端不可用，用本地
  _db = local || { tasks:{}, plan:{} };
  updateSyncStatus(_db === local ? 'local' : 'empty');
  // 后台尝试上传本地数据
  if (local) saveToCloud(local).catch(() => {});
}

async function saveToCloud(db) {
  try {
    await sb.from('checkin_data').upsert({ id: 1, data: db, updated_at: new Date().toISOString() });
    localStorage.setItem('checkin_last_sync', new Date().toISOString());
    updateSyncStatus('cloud');
  } catch(e) {
    updateSyncStatus('local');
    throw e;
  }
}

function load() { return _db; }
function save(db) {
  _db = db;
  localStorage.setItem(STORE, JSON.stringify(db));
  // 后台异步存云端
  saveToCloud(db).catch(() => {});
}

function updateSyncStatus(status) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (status === 'cloud') { el.textContent = '☁️'; el.title = '已同步到云端'; }
  else if (status === 'local') { el.textContent = '💾'; el.title = '仅本地存储（云端暂不可用）'; }
  else { el.textContent = '🔄'; el.title = '同步中…'; }
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

function tasksOf(dayKey) {
  const db = load();
  if (!db.tasks[dayKey]) db.tasks[dayKey] = [];
  return db.tasks[dayKey];
}
function saveTasks(dayKey, arr) {
  const db = load();
  db.tasks[dayKey] = arr;
  save(db);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ============================================================
//  STATE
// ============================================================
let viewY, viewM;
let viewMode = 'month';   // 'month' | 'week'
let weekOffset = 0;       // 0 = current week, -1 = last week, 1 = next week
let selDay = todayStr();
let notificationOn = false;

// ============================================================
//  VIEW SWITCHING
// ============================================================
function switchView(mode) {
  viewMode = mode;
  document.querySelectorAll('#viewToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === mode);
  });
  render();
}

// ============================================================
//  MONTH VIEW
// ============================================================
function initView() {
  const now = new Date();
  viewY = now.getFullYear();
  viewM = now.getMonth() + 1;
  weekOffset = 0;
}

function navMonth(d) {
  viewM += d;
  if (viewM < 1) { viewM = 12; viewY--; }
  if (viewM > 12) { viewM = 1; viewY++; }
  render();
}

function dayStatus(key) {
  const tasks = tasksOf(key);
  if (tasks.length === 0) return 'empty';
  const done = tasks.filter(t => t.done).length;
  if (done === tasks.length) return 'done';
  if (done > 0) return 'partial';
  return 'pending';
}

function renderMonthView() {
  let html = `
    <div class="nav-row">
      <button onclick="navMonth(-1)">◀</button>
      <span>${viewY}年 ${viewM}月</span>
      <button onclick="navMonth(1)">▶</button>
    </div>
    <div class="weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="days-grid">`;

  const today = todayStr();
  const daysInMonth = new Date(viewY, viewM, 0).getDate();
  const firstDow = new Date(viewY, viewM - 1, 1).getDay();
  const now = new Date();

  for (let i = 0; i < firstDow; i++) {
    html += '<div class="day-cell empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${viewY}-${pad(viewM)}-${pad(d)}`;
    const status = dayStatus(key);
    let cls = 'day-cell';
    if (key === today) cls += ' today';
    if (key === selDay) cls += ' selected';
    const cellDate = new Date(viewY, viewM - 1, d);
    if (cellDate > now) cls += ' future';
    html += `<div class="${cls}" data-key="${key}">${d}`;
    if (status !== 'empty') {
      html += `<span class="dot ${status}"></span>`;
    }
    html += '</div>';
  }

  html += '</div>';
  html += `<div class="legend">
    <i class="l-done"></i>全部完成
    <i class="l-half"></i>部分完成
    <i class="l-none"></i>有待办
  </div>`;

  document.getElementById('calPanel').innerHTML = html;

  // bind clicks
  document.querySelectorAll('.day-cell:not(.empty)').forEach(el => {
    el.addEventListener('click', () => {
      selDay = el.dataset.key;
      render();
    });
  });
}

// ============================================================
//  WEEK VIEW
// ============================================================
function getWeekStart(offset) {
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const diff = day === 0 ? -6 : 1 - day; // Monday
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff + (offset * 7));
  monday.setHours(0,0,0,0);
  return monday;
}

function navWeek(d) {
  weekOffset += d;
  render();
}

function renderWeekView() {
  const mon = getWeekStart(weekOffset);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);

  // Format range for header
  const monStr = `${mon.getMonth()+1}/${mon.getDate()}`;
  const sunStr = `${sun.getMonth()+1}/${sun.getDate()}`;
  const yearStr = mon.getFullYear() !== sun.getFullYear() ? ` ${mon.getFullYear()}` : '';

  let html = `
    <div class="nav-row">
      <button onclick="navWeek(-1)">◀</button>
      <span>${monStr} - ${sunStr}${yearStr}</span>
      <button onclick="navWeek(1)">▶</button>
    </div>
    <div class="week-grid">`;

  const today = todayStr();
  const wdNames = ['周一','周二','周三','周四','周五','周六','周日'];
  const dayKeys = [];

  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    dayKeys.push(key);

    const tasks = tasksOf(key);
    const doneCount = tasks.filter(t => t.done).length;
    const allDone = tasks.length > 0 && doneCount === tasks.length;

    let cls = 'week-day-row';
    if (key === today) cls += ' today';
    if (key === selDay) cls += ' selected';
    if (allDone) cls += ' all-done';

    let tasksHtml = '';
    if (tasks.length === 0) {
      tasksHtml = '<span style="color:#cbd5e1;font-size:12px">暂无任务</span>';
    } else {
      tasks.forEach(t => {
        tasksHtml += `<span class="wt${t.done ? ' done' : ''}">${t.done ? '✓' : '○'} ${esc(t.name)}</span>`;
      });
    }

    html += `
      <div class="${cls}" data-key="${key}">
        <div class="week-day-label">
          <span class="wd">${wdNames[i]}</span>
          <span>${d.getMonth()+1}/${d.getDate()}</span>
        </div>
        <div class="week-day-tasks">${tasksHtml}</div>
      </div>`;
  }

  html += '</div>';
  document.getElementById('calPanel').innerHTML = html;

  // bind clicks
  document.querySelectorAll('.week-day-row').forEach(el => {
    el.addEventListener('click', () => {
      selDay = el.dataset.key;
      render();
    });
  });
}

// ============================================================
//  TASK PANEL
// ============================================================
function renderTaskPanel() {
  const panel = document.getElementById('taskPanel');
  const tasks = tasksOf(selDay);
  const doneCount = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
  const allDone = total > 0 && doneCount === total;

  const d = new Date(selDay + 'T00:00:00');
  const weekdays = ['日','一','二','三','四','五','六'];
  const dateTitle = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const weekday = weekdays[d.getDay()];

  let badgeHtml = '';
  if (total > 0 && allDone) badgeHtml = '<span class="day-status-badge all-done">✓ 全部完成</span>';
  else if (total > 0 && doneCount > 0) badgeHtml = `<span class="day-status-badge partial">${doneCount}/${total} 已完成</span>`;
  else if (total > 0) badgeHtml = '<span class="day-status-badge empty">未开始</span>';

  let html = `
    <div class="task-header">
      <div>
        <span class="date-title">${dateTitle}</span>
        <span class="date-weekday">星期${weekday}</span>
        ${badgeHtml}
      </div>
    </div>
    ${total > 0 ? `
      <div class="progress-text">已完成 ${doneCount}/${total}</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill ${allDone ? 'full' : ''}" style="width:${pct}%"></div>
      </div>` : ''}
    <div class="task-list">`;

  // 空任务时提供快捷入口
  if (total === 0) {
    const plan = getPlan();
    const dow = d.getDay();
    const dailyTasks = plan['_daily'] || [];
    const wdTasks = plan[dow] || [];
    const allPlanTasks = [...dailyTasks, ...wdTasks];

    if (allPlanTasks.length > 0) {
      html += `<span class="copy-link" onclick="copyFromPlan(${dow})">📋 从周计划复制 (${allPlanTasks.length}个)</span>`;
    }

    const yesterday = new Date(d);
    yesterday.setDate(yesterday.getDate() - 1);
    const yKey = `${yesterday.getFullYear()}-${pad(yesterday.getMonth()+1)}-${pad(yesterday.getDate())}`;
    const yTasks = tasksOf(yKey);
    if (yTasks.length > 0) {
      html += `<span class="copy-link" onclick="copyFromDay('${yKey}')">📋 从昨天复制 (${yTasks.length}个)</span>`;
    }
  }

  tasks.forEach((t, i) => {
    const urgent = t.deadline && isUrgent(t);
    html += `
      <div class="task-item ${t.done ? 'done' : ''}">
        <div class="task-check" onclick="toggleTask(${i})">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="5 12 10 17 19 8"/>
          </svg>
        </div>
        <span class="task-name" onclick="editTaskName(${i})" title="点击编辑">${esc(t.name)}</span>
        ${t.deadline
          ? `<span class="task-time${urgent ? ' urgent' : ''}" onclick="editTaskTime(${i})" title="截止时间 · 点击修改">⏰ ${t.deadline}</span>`
          : `<span class="task-time" onclick="editTaskTime(${i})" title="点击设置截止时间">+ 时间</span>`}
        <button class="task-del" onclick="deleteTask(${i})" title="删除">×</button>
      </div>`;
  });

  html += `</div>
    <div class="add-task-form">
      <input type="text" id="newTaskName" placeholder="添加新任务…" maxlength="60" onkeydown="if(event.key==='Enter')addTask()">
      <input type="time" id="newTaskTime" value="21:00">
      <button onclick="addTask()">添加</button>
    </div>`;

  panel.innerHTML = html;
  setTimeout(() => {
    const inp = document.getElementById('newTaskName');
    if (inp) inp.focus();
  }, 50);
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function isUrgent(task) {
  if (!task.deadline || task.done) return false;
  const [h, m] = task.deadline.split(':').map(Number);
  const dl = h * 60 + m;
  const now = new Date();
  const nm = now.getHours() * 60 + now.getMinutes();
  return nm >= dl - 60 && nm < dl;
}

// ============================================================
//  TASK CRUD
// ============================================================
function addTask() {
  const nameEl = document.getElementById('newTaskName');
  const timeEl = document.getElementById('newTaskTime');
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const tasks = tasksOf(selDay);
  tasks.push({ id: uid(), name, deadline: timeEl.value || '', done: false });
  saveTasks(selDay, tasks);
  nameEl.value = '';
  render();
}

function toggleTask(i) {
  const tasks = tasksOf(selDay);
  if (i < 0 || i >= tasks.length) return;
  tasks[i].done = !tasks[i].done;
  saveTasks(selDay, tasks);
  render();
}

function deleteTask(i) {
  const tasks = tasksOf(selDay);
  if (i < 0 || i >= tasks.length) return;
  tasks.splice(i, 1);
  saveTasks(selDay, tasks);
  render();
}

function editTaskName(i) {
  const span = document.querySelectorAll('.task-name')[i];
  if (!span) return;
  const tasks = tasksOf(selDay);
  const t = tasks[i];
  const input = document.createElement('input');
  input.type = 'text';
  input.value = t.name;
  input.style.cssText = 'flex:1;font-size:15px;font-weight:500;border:1px solid var(--pri);border-radius:6px;padding:2px 6px;outline:none;background:var(--pri-light);';
  span.replaceWith(input);
  input.focus();
  input.select();
  function commit() {
    const v = input.value.trim();
    if (v) { t.name = v; saveTasks(selDay, tasks); }
    render();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') render(); });
}

function editTaskTime(i) {
  const el = document.querySelectorAll('.task-time')[i];
  if (!el) return;
  const tasks = tasksOf(selDay);
  const t = tasks[i];
  const cur = t.deadline || '21:00';
  const input = document.createElement('input');
  input.type = 'time';
  input.value = cur;
  input.style.cssText = 'font-size:13px;border:1px solid var(--pri);border-radius:6px;padding:2px 6px;outline:none;width:100px;flex-shrink:0;';
  el.replaceWith(input);
  input.focus();
  function commit() {
    t.deadline = input.value || '';
    saveTasks(selDay, tasks);
    render();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') render(); });
}

function copyFromDay(srcKey) {
  const src = tasksOf(srcKey);
  if (src.length === 0) return;
  const tasks = tasksOf(selDay);
  src.forEach(t => {
    tasks.push({ id: uid(), name: t.name, deadline: t.deadline, done: false });
  });
  saveTasks(selDay, tasks);
  render();
}

function copyFromPlan(dow) {
  const plan = getPlan();
  const dailyTasks = plan['_daily'] || [];
  const wdTasks = plan[dow] || [];
  const ptasks = [...dailyTasks, ...wdTasks];
  if (ptasks.length === 0) return;
  const tasks = tasksOf(selDay);
  ptasks.forEach(t => {
    tasks.push({ id: uid(), name: t.name, deadline: t.deadline || '', done: false });
  });
  saveTasks(selDay, tasks);
  render();
}

// ============================================================
//  WEEKLY PLAN
// ============================================================
function getPlan() {
  const db = load();
  if (!db.plan) db.plan = {};
  return db.plan;
}
function savePlan(plan) {
  const db = load();
  db.plan = plan;
  save(db);
}

function openPlanModal() {
  document.getElementById('planModal').style.display = 'flex';
  renderPlanModal();
}

function closePlanModal() {
  document.getElementById('planModal').style.display = 'none';
}

function renderPlanModal() {
  const plan = getPlan();
  const wdNames = ['周日','周一','周二','周三','周四','周五','周六'];
  const body = document.getElementById('planModalBody');
  let html = '';

  // ---- 每日固定任务 ----
  const dailyTasks = plan['_daily'] || [];
  html += `
    <div class="plan-row" style="border:2px solid var(--pri);border-radius:var(--radius);background:var(--pri-light);">
      <div class="plan-row-label" style="color:var(--pri);font-size:15px">🔁<br>每日</div>
      <div class="plan-row-tasks" id="planTasks_daily">`;
  dailyTasks.forEach((t, i) => {
    html += `
        <div class="plan-task-item">
          <span>${esc(t.name)}</span>
          <input type="time" value="${t.deadline || ''}" onchange="updatePlanTask('_daily',${i},'deadline',this.value)" placeholder="时间">
          <button class="plan-task-del" onclick="deletePlanTask('_daily',${i})" title="删除">×</button>
        </div>`;
  });
  html += `
        <div class="plan-add-task">
          <input type="text" placeholder="每天都要做的事…" id="planAddName_daily" maxlength="40" onkeydown="if(event.key==='Enter')addPlanTask('_daily')">
          <input type="time" value="15:00" id="planAddTime_daily">
          <button onclick="addPlanTask('_daily')">添加</button>
        </div>
      </div>
    </div>`;

  // ---- 每周分天 ----
  const order = [1,2,3,4,5,6,0];
  order.forEach(dow => {
    const tasks = plan[dow] || [];
    html += `
      <div class="plan-row">
        <div class="plan-row-label">${wdNames[dow]}</div>
        <div class="plan-row-tasks" id="planTasks${dow}">`;
    tasks.forEach((t, i) => {
      html += `
          <div class="plan-task-item">
            <span>${esc(t.name)}</span>
            <input type="time" value="${t.deadline || ''}" onchange="updatePlanTask(${dow},${i},'deadline',this.value)" placeholder="时间">
            <button class="plan-task-del" onclick="deletePlanTask(${dow},${i})" title="删除">×</button>
          </div>`;
    });
    html += `
          <div class="plan-add-task">
            <input type="text" placeholder="添加任务…" id="planAddName${dow}" maxlength="40" onkeydown="if(event.key==='Enter')addPlanTask(${dow})">
            <input type="time" value="21:00" id="planAddTime${dow}">
            <button onclick="addPlanTask(${dow})">添加</button>
          </div>
        </div>
      </div>`;
  });

  html += '<p style="font-size:12px;color:var(--sub);margin-top:8px">🔁 每日任务 = 每天自动出现 ｜ 分天任务 = 只在对应星期几出现</p>';
  body.innerHTML = html;
}

function addPlanTask(dow) {
  const nameEl = document.getElementById(`planAddName${dow}`);
  const timeEl = document.getElementById(`planAddTime${dow}`);
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const plan = getPlan();
  if (!plan[dow]) plan[dow] = [];
  plan[dow].push({ name, deadline: timeEl.value || '' });
  savePlan(plan);
  nameEl.value = '';
  renderPlanModal();
}

function deletePlanTask(dow, i) {
  const plan = getPlan();
  if (!plan[dow]) return;
  plan[dow].splice(i, 1);
  savePlan(plan);
  renderPlanModal();
}

function updatePlanTask(dow, i, field, value) {
  const plan = getPlan();
  if (!plan[dow] || !plan[dow][i]) return;
  plan[dow][i][field] = value;
  savePlan(plan);
}

function applyPlanToWeek() {
  const plan = getPlan();
  const dailyTasks = plan['_daily'] || [];
  const mon = getWeekStart(0); // current week

  let applied = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    const dow = d.getDay();
    const ptasks = [...dailyTasks, ...(plan[dow] || [])];
    if (ptasks.length === 0) continue;
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const tasks = tasksOf(key);
    if (tasks.length > 0) continue;
    ptasks.forEach(t => {
      tasks.push({ id: uid(), name: t.name, deadline: t.deadline || '', done: false });
    });
    saveTasks(key, tasks);
    applied++;
  }

  closePlanModal();
  if (applied > 0) {
    alert(`已应用周计划到本周 ${applied} 天`);
  } else {
    alert('本周每天都已经有任务了，无需应用。');
  }
  render();
}

// Close modal on overlay click
document.addEventListener('click', e => {
  if (e.target.id === 'planModal') closePlanModal();
});

// ============================================================
//  NOTIFICATIONS
// ============================================================
function toggleNotification() {
  if (!('Notification' in window)) {
    alert('你的浏览器不支持桌面通知');
    return;
  }
  if (Notification.permission === 'granted') {
    notificationOn = !notificationOn;
  } else {
    Notification.requestPermission().then(p => {
      notificationOn = (p === 'granted');
      updateBell();
    });
    return;
  }
  updateBell();
}

function updateBell() {
  const btn = document.getElementById('bellBtn');
  if (Notification.permission === 'granted' && notificationOn) {
    btn.className = 'bell-btn on';
    btn.title = '提醒已开启 — 点击关闭';
  } else {
    btn.className = 'bell-btn';
    btn.title = Notification.permission !== 'granted' ? '点击开启桌面提醒' : '提醒已关闭 — 点击开启';
  }
}

function checkDeadlines() {
  if (!notificationOn || Notification.permission !== 'granted') return;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const today = todayStr();
  const tasks = tasksOf(today);

  tasks.forEach(t => {
    if (t.done || !t.deadline) return;
    const [h, m] = t.deadline.split(':').map(Number);
    const dlMin = h * 60 + m;
    const notifyMin = dlMin - 30;
    if (nowMin < notifyMin || nowMin >= dlMin) return;
    const nKey = `notified_${today}_${t.id}`;
    if (sessionStorage.getItem(nKey)) return;
    const minLeft = dlMin - nowMin;
    const timeDesc = minLeft > 60 ? `${Math.floor(minLeft/60)}小时${minLeft%60}分钟` : `${minLeft}分钟`;
    try {
      new Notification('⏰ 任务提醒', {
        body: `"${t.name}" 还有${timeDesc}截止 (${t.deadline})`,
        icon: './icon.svg',
        tag: nKey,
        requireInteraction: true
      });
    } catch(_) {}
    sessionStorage.setItem(nKey, '1');
  });
}

// ============================================================
//  RENDER ALL
// ============================================================
function render() {
  if (viewMode === 'week') {
    renderWeekView();
  } else {
    renderMonthView();
  }
  renderTaskPanel();
}

// ============================================================
//  INIT
// ============================================================
async function init() {
  document.getElementById('syncStatus').textContent = '🔄';
  await initDB();
  initView();
  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  if ('Notification' in window && Notification.permission === 'granted') {
    notificationOn = true;
  }
  updateBell();

  setInterval(checkDeadlines, 30000);
  setTimeout(checkDeadlines, 2000);
}

document.addEventListener('DOMContentLoaded', init);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && e.ctrlKey) {
    viewMode === 'week' ? navWeek(-1) : navMonth(-1);
  }
  if (e.key === 'ArrowRight' && e.ctrlKey) {
    viewMode === 'week' ? navWeek(1) : navMonth(1);
  }
  if (e.key === 't' && e.ctrlKey) {
    e.preventDefault();
    selDay = todayStr();
    initView();
    render();
  }
});
</script>
